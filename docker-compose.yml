services:
  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barometre
    ports:
      - "5432:5432"

  # Expose /metrics sur le port 8000 (Partie 2 de la consigne)
  metrics:
    build:
      context: .
      dockerfile: Dockerfile
    command: python3 quotaclimat/monitoring/metrics_server.py
    ports:
      - "8000:8000"

  # UI sur http://localhost:9090 - va chercher les métriques du service
  # "metrics" toutes les 15s (voir monitoring/prometheus.yml)
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # UI sur http://localhost:3000 (login: admin/admin) - datasource Prometheus
  # et dashboard pré-chargés automatiquement (voir monitoring/grafana/)
  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # Loki : Système d'agrégation de logs
  loki:
    image: grafana/loki:3.3.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro

  # Promtail : Agent pour collecter et envoyer les logs vers Loki
  promtail:
    image: grafana/promtail:3.3.0
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
