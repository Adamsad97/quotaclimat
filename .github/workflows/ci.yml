name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.1.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stage 1: install dependencies (also warms the Poetry cache for later jobs)
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

  # Stage 2: run the test suite against a real Postgres database.
  test-update-pg-keywords:
    name: Run tests (update pg keywords)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: &postgres-service
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pytest-args: "-k 'test_update_pg_keywords' test/"
          report-name: update-pg-keywords

  test-stop-word:
    name: Run tests (stop word)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres-service
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pytest-args: "-k 'stop_word' test/"
          report-name: stop-word

  test-print-media:
    name: Run tests (print media)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pytest-args: "test/print_media/test_print_media_detect_keywords.py"
          report-name: print-media

  test-everything-else:
    name: Run tests (everything else)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres: *postgres-service
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/run-tests
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          pre-run: "python3 -m http.server 8000 --directory mockwebsite &"
          pytest-args: >-
            -k 'not test_update_pg_keywords and not stop_word'
            --ignore=test/print_media/test_print_media_detect_keywords.py
            test/
          report-name: everything-else

  # Stage 3: check code style with ruff
  lint:
    name: Run linter
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run ruff
        run: poetry run ruff check . || true
        continue-on-error: true

  # Stage 4: look for common security issues in the Python source code
  security-scan:
    name: Run security scan
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Run bandit
        run: |
          poetry run pip install bandit
          poetry run bandit -r quotaclimat -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security scan report
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-report
          path: bandit-report.json

  # Stage 5: build the Docker image and scan it for known vulnerabilities
  build-image:
    name: Build Docker image
    needs:
      - test-update-pg-keywords
      - test-stop-word
      - test-print-media
      - test-everything-else
      - lint
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t quotaclimat:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quotaclimat:${{ github.sha }}
          format: json
          output: trivy-report.json

      - name: Generate VEX file from the Trivy report
        run: python3 scripts/generate_vex.py trivy-report.json vex.json

      - name: Upload Trivy + VEX report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-vex-report
          path: |
            trivy-report.json
            vex.json

  # Stage 6: push the image to the registry, but only from the main branch
  push-image:
    name: Push to registry
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
